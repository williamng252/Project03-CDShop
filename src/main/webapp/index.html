<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CD list</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
<h1>CD list</h1>

<form action="cart" method="post">
    <table class="cd-list">
        <thead>
        <tr>
            <th scope="col">Description</th>
            <th scope="col">Price</th>
            <th scope="col" aria-label="Actions"></th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>86 (the band) - True Life Songs and Pictures</td>
            <td>$14.95</td>
            <td>
                <button type="submit" name="productCode" value="8601">
                    Add To Cart
                </button>
            </td>
        </tr>
        <tr>
            <td>Paddlefoot - The first CD</td>
            <td>$12.95</td>
            <td>
                <button type="submit" name="productCode" value="pf01">
                    Add To Cart
                </button>
            </td>
        </tr>
        <tr>
            <td>Paddlefoot - The second CD</td>
            <td>$14.95</td>
            <td>
                <button type="submit" name="productCode" value="pf02">
                    Add To Cart
                </button>
            </td>
        </tr>
        <tr>
            <td>Joe Rut - Genuine Wood Grained Finish</td>
            <td>$14.95</td>
            <td>
                <button type="submit" name="productCode" value="jr01">
                    Add To Cart
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</form>
</body>
</html>
